name: Deploy TAS Tool
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Unpack and patch the browser build
        run: |
          mkdir -p dist
          tar -xzf site-bundle.tar.gz -C dist
          node scripts/remove-transfer.cjs dist
          test -f dist/index.html
          test -f dist/polytrack_physics.wasm
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
